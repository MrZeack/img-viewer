[package]
name = "img_viewer"
version = "0.1.1"
edition = "2021"

[dependencies]
eframe = "0.28"
egui = "0.28"
image = { version = "0.25", features = ["jpeg", "png"] }
tokio = { version = "1.0", features = ["full"] }
rayon = "1.8"
lru = "0.12"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
rfd = "0.14"
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] }
once_cell = "1.19"
kamadak-exif = "0.6.1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
