[package]
name = "img_viewer"
version = "0.2.1"
edition = "2021"
default-run = "img_viewer"

[dependencies]
eframe = "0.28"
egui = "0.28"
image = { version = "0.25", features = ["jpeg", "png"] }
rayon = "1.8"
lru = "0.12"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
rfd = "0.14"
serde = { version = "1.0", features = ["derive"] }
kamadak-exif = "0.6.1"
toml = "0.9.5"
libheif-rs = "1.0"
quickraw = "0.1.6"
little_exif = "0.6"
memmap2 = "0.9"
directories = "5.0"
jpeg-decoder = { version = "0.3", default-features = false }

[profile.release]
lto = true
codegen-units = 1
panic = "unwind" # needed so panics in quickraw can be caught (see safe_export_thumbnail)

[dev-dependencies]
